name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type (debug or release)"
        required: true
        default: "debug"
        type: choice
        options: [debug, release]

jobs:
  build-apk:
    name: Build & Package Android APK v1.1.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK & Accept Licenses
        shell: bash
        run: |
          SDKMANAGER=""
          if command -v sdkmanager &> /dev/null; then
            SDKMANAGER="sdkmanager"
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          elif [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          fi

          if [ -n "$SDKMANAGER" ]; then
            echo "Using sdkmanager at $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses || true
          else
            echo "sdkmanager not found, skipping license auto-accept"
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Platform
        run: npx cap sync android

      - name: Verify Android App Configuration
        shell: bash
        run: |
          set -e
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/tuktukirsangsar/app/NativePrintPlugin.java
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo "Camera permission, native PDF/print plugin and app icon are present."

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android APK
        shell: bash
        run: |
          set -e
          cd android
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Prepare APK Artifact
        shell: bash
        run: |
          set -e
          mkdir -p release-artifacts

          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk \
              release-artifacts/tuktukir-sangsar-v1.1.0-debug.apk
          fi

          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk \
              release-artifacts/tuktukir-sangsar-v1.1.0-release-unsigned.apk
          fi

          echo "Generated APK files:"
          ls -lh release-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tuktukir-Sangsar-APK-v1.1.0
          path: release-artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
