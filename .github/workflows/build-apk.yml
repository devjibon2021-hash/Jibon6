name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Show tool versions
        shell: bash
        run: |
          set -eux
          node --version
          npm --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          adb --version || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eux
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -eux
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build web application
        shell: bash
        run: |
          set -eux
          npm run build

      - name: Check Capacitor configuration
        shell: bash
        run: |
          set -eux
          test -f capacitor.config.ts || \
          test -f capacitor.config.json || \
          test -f capacitor.config.js

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -eux
          npx cap sync android

      - name: Make Gradle executable
        shell: bash
        run: |
          set -eux
          test -f android/gradlew
          chmod +x android/gradlew

      - name: Verify Android project
        shell: bash
        run: |
          set -eux
          cd android
          ./gradlew --version
          ./gradlew tasks --no-daemon

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        shell: bash
        run: |
          set -eux
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        shell: bash
        run: |
          set -eux
          cd android
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Locate APK
        shell: bash
        run: |
          set -eux
          find android/app/build/outputs/apk \
            -type f -name "*.apk" -print

      - name: Upload Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
