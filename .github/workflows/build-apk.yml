name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Do NOT use android-actions/setup-android here.
      # GitHub ubuntu-latest already contains the Android SDK.
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK_ROOT"
          test -d "$SDK_ROOT"

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_ROOT/cmdline-tools/*/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/*/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n 1)"
          fi

          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          "$SDKMANAGER" --version || true

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - name: Show tool versions
        shell: bash
        run: |
          set -eux
          node --version
          npm --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v adb || true
          adb --version || true
          command -v sdkmanager || true
          sdkmanager --version || true

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -eux
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build web application
        shell: bash
        run: |
          set -eux
          npm run build

      - name: Check Capacitor configuration
        shell: bash
        run: |
          set -eux
          test -f capacitor.config.ts ||           test -f capacitor.config.json ||           test -f capacitor.config.js

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -eux
          npx cap sync android

      - name: Prepare Gradle
        shell: bash
        run: |
          set -eux
          test -f android/gradlew
          chmod +x android/gradlew

      - name: Verify Gradle project
        shell: bash
        run: |
          set -eux
          cd android
          ./gradlew --version
          ./gradlew tasks --no-daemon

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        shell: bash
        run: |
          set -eux
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        shell: bash
        run: |
          set -eux
          cd android
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Show generated APK files
        shell: bash
        run: |
          set -eux
          find android/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
